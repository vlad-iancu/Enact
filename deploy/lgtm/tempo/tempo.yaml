# Tempo single-binary config for local dev.
#
# Receives traces over OTLP and, via the metrics-generator, derives span
# metrics and a service graph that it remote-writes to Mimir so Grafana can
# show RED metrics and a topology alongside the traces.

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h   # short retention: local dev only

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  # local-blocks keeps recent spans queryable so Tempo can answer TraceQL
  # metrics queries (rate/histogram over spans) — required by Grafana's
  # Traces Drilldown. flush_to_storage persists those blocks so the metrics
  # queries also work across restarts / longer ranges.
  processor:
    local_blocks:
      flush_to_storage: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  metrics_generator_processors:
    - service-graphs
    - span-metrics
    - local-blocks
