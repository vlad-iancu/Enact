# Local infrastructure for the enact agent platform.
#
# Brings up the stateful dependencies the services need:
#   * OpenSearch  - metadata (KBs, agents) + vector (k-NN) storage
#   * Redis       - document-indexing work queue (Redis Streams)
#   * Tika        - document text extraction for the KB indexer
#
# The enact services themselves are NOT run here; start them with
# `go run ./cmd/<service>` (see the README). This keeps the dev loop fast.
#
#   docker compose -f deploy/docker-compose.infra.yml up -d
#
# OpenSearch security is enabled with the default self-signed cert and the
# admin/9zT!mPq4#bRk7Fx2 credentials the services default to. This is for LOCAL DEV ONLY.

services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: enact-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      # OpenSearch 2.12+ requires an explicit initial admin password.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=9zT!mPq4#bRk7Fx2
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"   # REST API (https, self-signed)
      - "9600:9600"   # performance analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:9zT!mPq4#bRk7Fx2 https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: enact-opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      # Point Dashboards at the single-node cluster over its self-signed https endpoint.
      - 'OPENSEARCH_HOSTS=["https://opensearch:9200"]'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=9zT!mPq4#bRk7Fx2
      # Self-signed cert in local dev: skip verification.
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5601:5601"   # Dashboards web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: enact-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  tika:
    image: apache/tika:2.9.2.1-full
    container_name: enact-tika
    ports:
      - "9998:9998"   # Tika REST server (matches TIKA_URL default)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  opensearch-data:
  redis-data:
