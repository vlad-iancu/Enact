# The enact deployment stack: the seven Go services PLUS the full
# infrastructure they depend on — OpenSearch (+ Dashboards), Redis, Tika.
# One `docker compose up -d` on a VM brings up the whole platform; only
# AWS (Bedrock/S3/SES/CloudFront) remains external.
#
# Explicit project name: docker-compose.infra.yml has none (its project is
# the directory name "deploy") and the LGTM stack is "enact-lgtm"; without
# a distinct name this file would collide with the infra project.
#
# Interpolated variables (from a .env beside this file, or the shell):
#   ENACT_REGISTRY       image prefix, e.g. ghcr.io/<owner>     (required)
#   ENACT_TAG            image tag, e.g. a git SHA              (default: latest)
#   OPENSEARCH_PASSWORD  admin password for the in-stack cluster (required)
#
# Uncommitted env files expected next to this file (copy from *.example):
#   app.env         AWS credentials + platform settings (all services)
#   enact-main.env  browser-facing secrets (enact-main only — FRONTEND_URL
#                   lives here so CORS is not enabled fleet-wide)
# Infrastructure endpoints are wired below via the x-infra-env anchor and
# are not read from app.env (compose `environment:` wins over env_file).
#
# First boot: the Go services verify their indices at startup, so provision
# the cluster once (idempotent) before/while they crash-loop into health:
#
#   docker compose -f docker-compose.app.yml up -d opensearch
#   OPENSEARCH_ADDRESSES=https://127.0.0.1:9200 \
#     OPENSEARCH_PASSWORD=<password> ./scripts/infrastructure.sh provision
#   docker compose -f docker-compose.app.yml up -d
#
# S2S key material is bind-mounted from ./s2s (read-only) and loaded via
# the S2S_*_FILE variables; the images ship no dotenv files, so container
# environment is the only configuration source. The mount must be readable
# by uid 65532 (distroless nonroot).
#
# Published ports: enact-main (8000) publicly; enact-tests (8006),
# OpenSearch (9200, for provisioning/debugging) and Dashboards (5601) on
# loopback only — reach them through an SSH tunnel. A TLS reverse proxy in
# front of 8000 is out of scope here.
name: enact-app

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - ./s2s:/s2s:ro
  env_file:
    - app.env

# Connection settings for the in-stack infrastructure, merged into every
# service's environment. The self-signed OpenSearch certificate makes
# INSECURE_SKIP_VERIFY=true correct here (traffic never leaves the compose
# network).
x-infra-env: &infra-env
  OPENSEARCH_ADDRESSES: https://opensearch:9200
  OPENSEARCH_USERNAME: admin
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD in deploy/.env}
  OPENSEARCH_INSECURE_SKIP_VERIFY: "true"
  REDIS_ADDR: redis:6379

services:
  # --- Infrastructure -------------------------------------------------------

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Sized for a small VM; raise on hosts with more memory to spare.
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD in deploy/.env}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch:9200"]'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD in deploy/.env}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "127.0.0.1:5601:5601"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  tika:
    image: apache/tika:2.9.2.1-full
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Web entry point (optional: --profile web) ----------------------------
  # Serves the frontend SPA from ./www and proxies /api/* to enact-main on
  # one origin (no CORS, cookies stay SameSite=lax). Requires ./Caddyfile
  # (copy Caddyfile.example) and the SPA build output in ./www. With a
  # domain configured in the Caddyfile, TLS certificates are automatic.

  caddy:
    image: caddy:2-alpine
    profiles: [web]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy-data:/data # ACME certificates survive recreation
      - caddy-config:/config

  # --- Services -------------------------------------------------------------

  enact-main:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-main:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - app.env
      - enact-main.env
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-main
      RBAC_API_URL: http://enact-rbac:8009
      SERVICE_PORT: "8000"
      INFERENCE_API_URL: http://enact-model-inference:8004
      MODELS_API_URL: http://enact-model-management:8005
      AGENT_API_URL: http://enact-agent-management-api:8001
      KB_API_URL: http://enact-kb-api:8002
      TOOL_REGISTRY_API_URL: http://enact-tool-registry:8007
      EXTERNAL_IDENTITIES_API_URL: http://enact-external-identities:8008
      WORKFLOW_API_URL: http://enact-workflows:8011
      # Sessions in Redis: a deploy restarts every container, and without
      # this that would sign out every user each time.
      SESSION_REDIS_ADDR: redis:6379
      SESSION_REDIS_DB: "1"
      # The same volume the runner writes to, at the same path: a reference
      # recorded by a run is resolved here when someone downloads the file.
      WORKFLOW_FILES_ROOT: /var/lib/enact/workflow-files
      S2S_KEY_ID: enact-main
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-main.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-main.key
    # Listed in full because an explicit volumes key REPLACES the anchor's
    # mounts rather than adding to them.
    volumes:
      - ./s2s:/s2s:ro
      - workflow-files:/var/lib/enact/workflow-files

  enact-agent-management-api:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-agent-management-api:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-agent-management-api
      SERVICE_PORT: "8001"
      KB_API_URL: http://enact-kb-api:8002
      TOOL_REGISTRY_API_URL: http://enact-tool-registry:8007
      RBAC_API_URL: http://enact-rbac:8009
      S2S_KEY_ID: enact-agent-management-api
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-agent-management-api.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-agent-management-api.key

  enact-kb-api:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-kb-api:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-kb-api
      RBAC_API_URL: http://enact-rbac:8009
      SERVICE_PORT: "8002"
      S2S_KEY_ID: enact-kb-api
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-kb-api.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-kb-api.key

  enact-kb-document-indexer:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-kb-document-indexer:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      tika:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-kb-document-indexer
      SERVICE_PORT: "8003"
      TIKA_URL: http://tika:9998
      S2S_KEY_ID: enact-kb-document-indexer
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-kb-document-indexer.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-kb-document-indexer.key

  enact-model-inference:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-model-inference:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
      # Redis carries the "credential connected" signal that resumes a tool
      # call parked on a missing credential.
      redis:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-model-inference
      RBAC_API_URL: http://enact-rbac:8009
      SERVICE_PORT: "8004"
      KB_API_URL: http://enact-kb-api:8002
      AGENT_API_URL: http://enact-agent-management-api:8001
      TOOL_REGISTRY_API_URL: http://enact-tool-registry:8007
      EXTERNAL_IDENTITIES_API_URL: http://enact-external-identities:8008
      S2S_KEY_ID: enact-model-inference
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-model-inference.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-model-inference.key

  enact-model-management:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-model-management:${ENACT_TAG:-latest}
    environment:
      SERVICE_NAME: enact-model-management
      SERVICE_PORT: "8005"
      S2S_KEY_ID: enact-model-management
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-model-management.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-model-management.key

  enact-tool-registry:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-tool-registry:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-tool-registry
      # Built-in servers are registered under the portless alias
      # "enact-mcp-servers"; this is what the registry resolves it to.
      MCP_SERVERS_URL: http://enact-mcp-servers:8010
      RBAC_API_URL: http://enact-rbac:8009
      SERVICE_PORT: "8007"
      # Probing a credential-gated MCP server needs the owner's credentials.
      EXTERNAL_IDENTITIES_API_URL: http://enact-external-identities:8008
      S2S_KEY_ID: enact-tool-registry
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-tool-registry.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-tool-registry.key

  enact-rbac:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-rbac:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-rbac
      SERVICE_PORT: "8009"
      S2S_KEY_ID: enact-rbac
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-rbac.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-rbac.key

  # Built-in MCP servers. No datastore, no credentials of its own: every
  # request carries the caller's third-party token, which is the only
  # authority a tool has.
  enact-mcp-servers:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-mcp-servers:${ENACT_TAG:-latest}
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-mcp-servers
      SERVICE_PORT: "8010"
      S2S_KEY_ID: enact-mcp-servers
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-mcp-servers.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-mcp-servers.key

  enact-external-identities:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-external-identities:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-external-identities
      RBAC_API_URL: http://enact-rbac:8009
      SERVICE_PORT: "8008"
      # The OAuth callback must be reachable by the user's BROWSER: behind
      # the Caddy entry point this is https://<domain>/identities.
      IDENTITIES_PUBLIC_URL: ${IDENTITIES_PUBLIC_URL:-http://localhost:8008}
      S2S_KEY_ID: enact-external-identities
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-external-identities.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-external-identities.key

  enact-tests:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-tests:${ENACT_TAG:-latest}
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      SERVICE_NAME: enact-tests
      RBAC_API_URL: http://enact-rbac:8009
      SERVICE_PORT: "8006"
      AGENT_API_URL: http://enact-agent-management-api:8001
      KB_API_URL: http://enact-kb-api:8002
      INFERENCE_API_URL: http://enact-model-inference:8004
      MODELS_API_URL: http://enact-model-management:8005
      MAIN_API_URL: http://enact-main:8000
      TOOL_REGISTRY_API_URL: http://enact-tool-registry:8007
      EXTERNAL_IDENTITIES_API_URL: http://enact-external-identities:8008
      TEST_MCP_URL: http://enact-tests:8099
      S2S_KEY_ID: enact-tests
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-tests.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-tests.key
      S2S_PRIVATE_KEYS_FILE: /s2s/private-keys.yaml

  enact-workflows:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-workflows:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-workflows
      SERVICE_PORT: "8011"
      # Its own stream, separate from document indexing: different work, a
      # different consumer, and very different durations.
      REDIS_STREAM: enact-workflow-executions
      REDIS_GROUP: workflow-runners
      AGENT_API_URL: http://enact-agent-management-api:8001
      RBAC_API_URL: http://enact-rbac:8009
      # Providers a step draws credentials from are validated here when a
      # workflow is saved.
      EXTERNAL_IDENTITIES_API_URL: http://enact-external-identities:8008
      # Deleting a workflow deletes its files. This service never reads
      # them, but it owns the cascade, so it needs the same volume.
      WORKFLOW_FILES_ROOT: /var/lib/enact/workflow-files
      S2S_KEY_ID: enact-workflows
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-workflows.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-workflows.key
    # Listed in full because an explicit volumes key REPLACES the anchor's
    # mounts rather than adding to them.
    volumes:
      - ./s2s:/s2s:ro
      - workflow-files:/var/lib/enact/workflow-files

  enact-workflow-runner:
    <<: *common
    image: ${ENACT_REGISTRY:?set ENACT_REGISTRY in deploy/.env}/enact-workflow-runner:${ENACT_TAG:-latest}
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *infra-env
      SERVICE_NAME: enact-workflow-runner
      SERVICE_PORT: "8012"
      REDIS_STREAM: enact-workflow-executions
      REDIS_GROUP: workflow-runners
      # A run can take far longer than an indexing job, so a delivery must sit
      # idle longer before another consumer may claim it — otherwise a slow
      # but healthy run is executed twice.
      REDIS_RECLAIM_MIN_IDLE: 15m
      INFERENCE_API_URL: http://enact-model-inference:8004
      # A provider-backed step fetches the triggering user's credential from
      # here at the moment it runs; nothing is stored on the workflow.
      EXTERNAL_IDENTITIES_API_URL: http://enact-external-identities:8008
      WORKFLOW_CODE_TIMEOUT: 5s
      WORKFLOW_STEP_TIMEOUT: 10m
      # Where a step's files are written. A named volume rather than the
      # container's own layer: a retained file outlives the run that made it,
      # so it must outlive the container too.
      #
      # Anything that SERVES these files must mount the same volume at the
      # same path — today only the runner reads them, and it reads them within
      # the run that wrote them. Once enact-main can download a file by
      # reference it needs this mount as well, and once the runner is scaled
      # past one host a shared local directory stops being possible at all.
      WORKFLOW_FILES_ROOT: /var/lib/enact/workflow-files
      S2S_KEY_ID: enact-workflow-runner
      S2S_JWKS_FILE: /s2s/jwks.yaml
      S2S_ACL_FILE: /s2s/acl/enact-workflow-runner.yaml
      S2S_PRIVATE_KEY_FILE: /s2s/keys/enact-workflow-runner.key
    # Listed in full because an explicit volumes key REPLACES the anchor's
    # mounts rather than adding to them, and dropping the s2s keys would leave
    # the runner unable to authenticate to anything.
    volumes:
      - ./s2s:/s2s:ro
      - workflow-files:/var/lib/enact/workflow-files

volumes:
  opensearch-data:
  redis-data:
  workflow-files:
  caddy-data:
  caddy-config: