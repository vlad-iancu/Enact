# LGTM observability stack for the enact agent platform.
#
# Brings up Grafana and its three signal backends, each receiving telemetry
# directly from the enact services over OTLP/HTTP:
#
#   * Tempo   - distributed traces   (OTLP :4318 http / :4317 grpc)
#   * Mimir   - metrics              (OTLP at :9009/otlp, PromQL at :9009/prometheus)
#   * Loki    - logs                 (OTLP at :3100/otlp)
#   * Grafana - unified UI at http://localhost:3000 (anonymous admin, no login)
#
# Start it alongside the app infrastructure:
#
#   docker compose -f deploy/docker-compose.lgtm.yml up -d      (or: make observability-up)
#
# Then run the services normally (go run ./cmd/<service>); the OTEL_* defaults
# in .env point at the published ports below. Open Grafana, pick Explore, and
# a request will show correlated logs (Loki) -> trace (Tempo) -> RED metrics
# and a service graph (Mimir).
#
# FOR LOCAL DEV ONLY: single-binary backends, filesystem storage, no auth.

# Own project name: both compose files live in deploy/, and without this both
# would resolve to the directory-derived project "deploy". Sharing a project
# makes each stack see the other's containers as orphans (and one stack's
# `down` can remove shared resources). Volumes and the default network are
# prefixed with this name, so infra and observability stay fully disjoint.
name: enact-lgtm

services:
  loki:
    image: grafana/loki:3.1.1
    container_name: enact-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"   # HTTP API + OTLP (/otlp/v1/logs)
    volumes:
      - ./lgtm/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  tempo:
    image: grafana/tempo:2.6.1
    container_name: enact-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo query API (Grafana datasource)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (/v1/traces)
    volumes:
      - ./lgtm/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      - mimir

  mimir:
    image: grafana/mimir:2.13.0
    container_name: enact-mimir
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    ports:
      - "9009:9009"   # HTTP API: OTLP (/otlp/v1/metrics), remote-write (/api/v1/push), PromQL (/prometheus)
    volumes:
      - ./lgtm/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9009/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    # 12.x: required by the Logs Drilldown app (grafana-lokiexplore-app 2.x
    # needs >= 11.6.11); also bundles it in recent releases.
    image: grafana/grafana:12.2.5
    container_name: enact-grafana
    ports:
      - "3000:3000"   # Grafana web UI
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
      # Queryless log browsing ("Explore > Logs"); bundled with Grafana only
      # from 11.3 on, so install it explicitly.
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app
    volumes:
      - ./lgtm/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
