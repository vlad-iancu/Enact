# Access control list for enact-kb-api.
#
# Route keys are "<METHOD> <go-restful route template>". Callers are S2S key
# ids; "*" admits any caller presenting a valid service token, "anonymous"
# admits requests without one. Unlisted routes deny everyone (default deny).
#
# This service is INTERNAL: no anonymous access anywhere — knowledge bases
# are only reachable through the other services.
service: enact-kb-api
rules:
  - route: "POST /v1/knowledge-bases"
    allow: ["*"]
  - route: "GET /v1/knowledge-bases"
    allow: ["*"]
  - route: "GET /v1/knowledge-bases/{id}"
    allow: ["*"]
  - route: "DELETE /v1/knowledge-bases/{id}"
    allow: ["*"]
  - route: "POST /v1/knowledge-bases/{id}/documents"
    allow: ["*"]

  # Document contents feed model context; the inference service needs the
  # full extracted text, and the tests service verifies this route.
  - route: "GET /v1/knowledge-bases/{id}/documents"
    allow: [enact-model-inference, enact-tests]