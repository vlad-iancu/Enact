# Access control list for enact-main.
# See enact-kb-api.yaml for the schema. Unlisted routes deny everyone.
#
# The main service is the browser-facing entry point: every auth route and
# page must be reachable without a service token. Authentication of PEOPLE
# happens in the handlers (sessions), not in the S2S layer.
service: enact-main
rules:
  - route: "GET /auth/google"
    allow: [anonymous, "*"]
  - route: "GET /google/oauth/callback"
    allow: [anonymous, "*"]
  - route: "POST /auth/register"
    allow: [anonymous, "*"]
  - route: "POST /auth/login"
    allow: [anonymous, "*"]
  - route: "POST /auth/logout"
    allow: [anonymous, "*"]
  - route: "GET /auth/me"
    allow: [anonymous, "*"]
  - route: "POST /auth/me/avatar"
    allow: [anonymous, "*"]
  # API key management. Anonymous at this layer like every other auth route —
  # a cookie session is what actually authorizes these, checked in the
  # handlers. They are deliberately NOT reachable with an API key: see
  # requireSessionOnly in internal/enactmain/apikeys.go.
  - route: "POST /auth/keys"
    allow: [anonymous, "*"]
  - route: "GET /auth/keys"
    allow: [anonymous, "*"]
  - route: "DELETE /auth/keys/{id}"
    allow: [anonymous, "*"]
  - route: "GET /auth/verify"
    allow: [anonymous, "*"]
  - route: "POST /auth/resend-verification"
    allow: [anonymous, "*"]
  - route: "GET /app"
    allow: [anonymous, "*"]
  - route: "GET /login"
    allow: [anonymous, "*"]

  # Conversations: browser-facing; PEOPLE are authenticated by the session
  # filter inside the handlers, not by S2S.
  - route: "GET /conversations"
    allow: [anonymous, "*"]
  - route: "POST /conversations"
    allow: [anonymous, "*"]
  - route: "GET /conversations/{id}"
    allow: [anonymous, "*"]
  - route: "PUT /conversations/{id}"
    allow: [anonymous, "*"]
  - route: "DELETE /conversations/{id}"
    allow: [anonymous, "*"]
  - route: "POST /conversations/{id}/messages"
    allow: [anonymous, "*"]
  - route: "GET /models"
    allow: [anonymous, "*"]
  - route: "POST /inference"
    allow: [anonymous, "*"]

  # Administration: browser-facing; the session filter authenticates the
  # person and the admin filter requires the ADMIN_EMAIL account.
  - route: "POST /admin/create-user"
    allow: [anonymous, "*"]
  - route: "GET /admin/users"
    allow: [anonymous, "*"]
  - route: "POST /admin/delete-user"
    allow: [anonymous, "*"]

  # MCP server management: browser-facing; sessions authenticate people and
  # ownership is enforced in the handlers.
  - route: "POST /mcp-servers"
    allow: [anonymous, "*"]
  - route: "GET /mcp-servers"
    allow: [anonymous, "*"]
  - route: "GET /mcp-servers/tools"
    allow: [anonymous, "*"]
  - route: "GET /mcp-servers/built-in"
    allow: [anonymous, "*"]
  - route: "PUT /mcp-servers/{id}"
    allow: [anonymous, "*"]
  - route: "DELETE /mcp-servers/{id}"
    allow: [anonymous, "*"]

  # Connected third-party accounts: browser-facing; the session decides
  # whose credentials are touched, never the request.
  # Organizations and RBAC (browser surface; enact-rbac enforces owner-gating).
  - route: "GET /organizations/me"
    allow: [anonymous, "*"]
  - route: "GET /organizations/me/roles"
    allow: [anonymous, "*"]
  - route: "POST /organizations/requests"
    allow: [anonymous, "*"]
  - route: "GET /organizations/requests"
    allow: [anonymous, "*"]
  - route: "GET /organizations/{id}/members"
    allow: [anonymous, "*"]
  - route: "POST /organizations/{id}/members"
    allow: [anonymous, "*"]
  - route: "DELETE /organizations/{id}/members/{user}"
    allow: [anonymous, "*"]
  - route: "POST /organizations/{id}/users"
    allow: [anonymous, "*"]
  - route: "GET /organizations/{id}/roles"
    allow: [anonymous, "*"]
  - route: "POST /organizations/{id}/roles"
    allow: [anonymous, "*"]
  - route: "DELETE /organizations/{id}/roles/{name}"
    allow: [anonymous, "*"]
  - route: "POST /organizations/{id}/roles/{name}/assign"
    allow: [anonymous, "*"]
  - route: "POST /organizations/{id}/roles/{name}/unassign"
    allow: [anonymous, "*"]
  - route: "GET /admin/organization-requests"
    allow: [anonymous, "*"]
  - route: "POST /admin/organization-requests/{id}/approve"
    allow: [anonymous, "*"]
  - route: "POST /admin/organization-requests/{id}/reject"
    allow: [anonymous, "*"]

  - route: "GET /identities"
    allow: [anonymous, "*"]
  - route: "GET /identities/providers"
    allow: [anonymous, "*"]
  - route: "POST /identities/providers/oauth"
    allow: [anonymous, "*"]
  - route: "POST /identities/providers/pat"
    allow: [anonymous, "*"]
  - route: "DELETE /identities/providers/{name}"
    allow: [anonymous, "*"]
  - route: "POST /identities/pat"
    allow: [anonymous, "*"]
  - route: "GET /identities/connect"
    allow: [anonymous, "*"]
  - route: "DELETE /identities/{provider}"
    allow: [anonymous, "*"]

  # Agent & knowledge-base management: browser-facing; sessions authenticate
  # people inside the handlers.
  - route: "GET /agents"
    allow: [anonymous, "*"]
  - route: "POST /agents"
    allow: [anonymous, "*"]
  - route: "PUT /agents/{id}"
    allow: [anonymous, "*"]
  - route: "DELETE /agents/{id}"
    allow: [anonymous, "*"]
  - route: "GET /agents/{id}"
    allow: [anonymous, "*"]
  - route: "GET /agents/{id}/required-identities"
    allow: [anonymous, "*"]
  - route: "GET /agents/{id}/rag/documents"
    allow: [anonymous, "*"]
  - route: "POST /agents/{id}/rag/documents"
    allow: [anonymous, "*"]
  - route: "DELETE /agents/{id}/rag/documents/{docId}"
    allow: [anonymous, "*"]
  - route: "GET /knowledge-bases"
    allow: [anonymous, "*"]
  - route: "POST /knowledge-bases"
    allow: [anonymous, "*"]
  - route: "GET /knowledge-bases/{id}"
    allow: [anonymous, "*"]
  - route: "PUT /knowledge-bases/{id}"
    allow: [anonymous, "*"]
  - route: "DELETE /knowledge-bases/{id}"
    allow: [anonymous, "*"]
  - route: "POST /knowledge-bases/{id}/documents"
    allow: [anonymous, "*"]
  - route: "DELETE /knowledge-bases/{id}/documents/{docId}"
    allow: [anonymous, "*"]

  # Product documentation: public by design — someone deciding whether to
  # sign up, or stuck at the "you need an organization" step, is exactly who
  # needs to read it.
  - route: "GET /docs"
    allow: [anonymous, "*"]
  - route: "GET /docs/{slug}"
    allow: [anonymous, "*"]

  # Workflows: browser-facing, and the one surface built to be driven by a
  # script — an API key authenticates a manual run. The workflow service
  # decides who may run what; this layer only admits the caller.
  - route: "GET /workflows"
    allow: [anonymous, "*"]
  - route: "POST /workflows"
    allow: [anonymous, "*"]
  - route: "GET /workflows/{id}"
    allow: [anonymous, "*"]
  - route: "PUT /workflows/{id}"
    allow: [anonymous, "*"]
  - route: "DELETE /workflows/{id}"
    allow: [anonymous, "*"]
  - route: "POST /workflows/{id}/executions"
    allow: [anonymous, "*"]
  - route: "GET /workflows/{id}/executions"
    allow: [anonymous, "*"]
  - route: "GET /workflows/executions/{executionId}"
    allow: [anonymous, "*"]
